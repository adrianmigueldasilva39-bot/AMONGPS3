name: Build PS3 PKG

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps3dev/ps3toolchain:latest
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set environment
        run: |
          echo "PSL1GHT=/usr/local/ps3dev/psl1ght" >> $GITHUB_ENV
          echo "PS3DEV=/usr/local/ps3dev" >> $GITHUB_ENV
          echo "PATH=$PATH:/usr/local/ps3dev/bin:/usr/local/ps3dev/ppu/bin:/usr/local/ps3dev/spu/bin" >> $GITHUB_ENV

      - name: Build
        run: |
          make clean || true
          make
          make pkg

      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: amongus-ps3-pkg
          path: amongus_ps3.pkg
          if-no-files-found: error
